name: outside checks

# For a pull request whose own run waits for a maintainer to approve it.
#
# Runs with this repository's token, so nothing the branch controls may be
# installed, imported or executed here. Do not add a step that builds or tests
# it: that needs pull_request, and the approval wait that comes with it.
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_REF: refs/pull/${{ github.event.pull_request.number }}/head

jobs:
  format:
    # a branch in this repository is not held, so meet.yml already reports it
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install dependencies
        run: cd src/frontend/ && npm ci
      - name: Read the branch's sources as data
        run: |
          git fetch --no-tags --depth 1 origin "$HEAD_REF"
          git checkout FETCH_HEAD -- src/frontend/src
      # without --config, prettier loads one the branch left among its own files
      - name: Check format
        run: cd src/frontend/ && npm run check -- --config .prettierrc

  changelog-length:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Read the branch's changelog as data
        run: |
          git fetch --no-tags --depth 1 origin "$HEAD_REF"
          git checkout FETCH_HEAD -- CHANGELOG.md
      - name: Check CHANGELOG max line length
        run: |
          max_line_length=$(cat CHANGELOG.md | grep -Ev "^\[.*\]: https://github.com" | wc -L)
          if [ $max_line_length -ge 80 ]; then
            echo "ERROR: CHANGELOG has lines longer than 80 characters."
            exit 1
          fi

  changelog-entry:
    if: |
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'noChangeLog') == false
    runs-on: ubuntu-latest
    steps:
      # the same unanchored match check-changelog makes, over the same file list
      - name: Check that the CHANGELOG has been modified in the current branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' | grep 'CHANGELOG.md'

  commits:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read the branch's commits as data
        run: git fetch --no-tags origin "$HEAD_REF"
      - name: Enforce absence of print statements in code
        if: always()
        run: |
          ! git diff origin/$BASE_REF...FETCH_HEAD -- . ':(exclude).github/workflows/**' | grep "print("
      - name: Check absence of fixup commits
        if: always()
        run: |
          ! git log origin/$BASE_REF..FETCH_HEAD | grep 'fixup!'
      - name: Install gitlint
        if: always()
        run: pip install --user requests gitlint
      # gitlint imports gitlint/, so those rules must come from this checkout
      - name: Lint commit messages added to main
        if: always()
        run: ~/.local/bin/gitlint --commits origin/$BASE_REF..FETCH_HEAD
