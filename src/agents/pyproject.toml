
[project]
name = "agents"
version = "1.32.1"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents==1.7.0",
    "livekit-plugins-deepgram==1.7.0",
    "livekit-plugins-silero==1.7.0",
    "livekit-plugins-kyutai-lasuite==0.0.6",
    "boto3==1.43.56",
    "python-dotenv==1.2.3",
    "protobuf==7.36.0",
    "sentry-sdk==2.68.1",
    "websockets==17.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",  # pydocstyle
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # Isort
    "ISC",  # flake8-implicit-str-concat
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLR",  # Pylint Refactor
    "PLW",  # Pylint Warning
    "RUF100",  # Ruff unused-noqa
    "S",  # flake8-bandit
    "T20", # flake8-print
    "W",  # pycodestyle warning
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # use of assert
]

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"
