upstream meet_backend {
    server backend:8000 fail_timeout=0;
}

upstream meet_frontend {
    server frontend:8080 fail_timeout=0;
}

server {
    listen 8083;
    server_name localhost;
    charset utf-8;
    server_tokens off;
    client_max_body_size 100M;

    location @proxy_to_meet_backend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_pass http://meet_backend;
    }

    location @proxy_to_meet_frontend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://meet_frontend;
    }

    location /        { try_files $uri @proxy_to_meet_frontend; }
    location /api     { try_files $uri @proxy_to_meet_backend; }
    # Only reachable when EXTERNAL_API_ENABLED=True on the backend.
    location /external-api { try_files $uri @proxy_to_meet_backend; }
    location /admin   { try_files $uri @proxy_to_meet_backend; }
    location /static  { try_files $uri @proxy_to_meet_backend; }
    location /oidc    { try_files $uri @proxy_to_meet_backend; }
    location /__heartbeat__   { try_files $uri @proxy_to_meet_backend; }
    location /__lbheartbeat__ { try_files $uri @proxy_to_meet_backend; }
    location /webhook { try_files $uri @proxy_to_meet_backend; }

    # ---- Recording downloads (uncomment if you enable recording) ----
    # See docs/self-hosting/configuration/recording.md for setup. Replace
    # <OBJECT_STORAGE_HOST> with the same host as your backend's
    # AWS_S3_ENDPOINT_URL, e.g. http://minio:9000 for self-hosted MinIO on
    # this Docker network, or the provider's public endpoint (AWS S3,
    # Scaleway Object Storage, OVHcloud Object Storage, etc.). Replace
    # <BUCKET_NAME> with AWS_STORAGE_BUCKET_NAME.
    #
    # location /media/ {
    #     auth_request /media-auth;
    #     auth_request_set $authHeader $upstream_http_authorization;
    #     auth_request_set $authDate $upstream_http_x_amz_date;
    #     auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;
    #
    #     proxy_set_header Authorization $authHeader;
    #     proxy_set_header X-Amz-Date $authDate;
    #     proxy_set_header X-Amz-Content-SHA256 $authContentSha256;
    #
    #     proxy_pass <OBJECT_STORAGE_HOST>/<BUCKET_NAME>/;
    #     proxy_set_header Host <OBJECT_STORAGE_HOST_NO_SCHEME>;
    # }
