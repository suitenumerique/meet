# Replaces docker/files/production/default.conf.template for the compose
# examples. It adds X-Forwarded-Proto, which Django's SSL redirect needs behind
# the TLS proxy, and client_max_body_size for uploads.
upstream meet_backend {
    server backend:8000 fail_timeout=0;
}

upstream meet_frontend {
    server frontend:8080 fail_timeout=0;
}

server {
    listen 8083;
    server_name localhost;
    charset utf-8;
    server_tokens off;
    client_max_body_size 100M;

    location @proxy_to_meet_backend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_pass http://meet_backend;
    }

    location @proxy_to_meet_frontend {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_pass http://meet_frontend;
    }

    location /        { try_files $uri @proxy_to_meet_frontend; }
    location /api     { try_files $uri @proxy_to_meet_backend; }
    # Only reachable when EXTERNAL_API_ENABLED=True on the backend.
    location /external-api { try_files $uri @proxy_to_meet_backend; }
    location /admin   { try_files $uri @proxy_to_meet_backend; }
    location /static  { try_files $uri @proxy_to_meet_backend; }
    location /__heartbeat__   { try_files $uri @proxy_to_meet_backend; }
    location /__lbheartbeat__ { try_files $uri @proxy_to_meet_backend; }

    # ---- Recording downloads: uncomment them as the Recording guide says ----
    # Set for the Recording guide's Garage. nginx fails to start while the
    # name garage does not resolve, so uncomment once Garage runs. With another
    # storage, put AWS_S3_ENDPOINT_URL and AWS_STORAGE_BUCKET_NAME in
    # proxy_pass, and that endpoint without http:// or https:// in Host.
